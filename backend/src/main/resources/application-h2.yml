# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# In-memory database - no PostgreSQL needed. Data resets on every restart.
spring:
  datasource:
    url: jdbc:h2:mem:uniloop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
